<app-header></app-header>
<section class="favorites-page">
  
    <div class="favorites-header">
      <p class="kicker">La teua selecció</p>
      <h1>Favorits</h1>
      <p>
        Guarda els productes que més t’interessen i torna a consultar-los quan vulgues.
      </p>
    </div>
  
    <div *ngIf="favorites.length > 0; else emptyFavorites" class="favorites-grid">
  
      <article class="product-card" *ngFor="let product of favorites">
        <button
        type="button"
        class="favorite-btn active"
        (click)="removeFavorite(product.id)">
      
        <img
          src="assets/icons/favorito.svg"
          alt="Favorit"
        >
      
      </button>
  
      <img
        class="product-image"
        [src]="'https://herbolari-susana.onrender.com/images/' + product.image"
        [alt]="product.name"
        loading="lazy"
       >
  
        <h3>{{ product.name }}</h3>
        <p class="description">{{ product.description }}</p>
       
  
        <div class="favorite-card-bottom">
          <p class="price">{{ product.price }} €</p>
        
          <button
            class="card-cart"
            type="button"
            (click)="addToCart(product)"
            [attr.aria-label]="'Afegir ' + product.name + ' al carret'">
            <img src="assets/icons/carro-de-la-compra.svg" alt="">
          </button>
        </div>
  
      </article>
  
    </div>
  
    <ng-template #emptyFavorites>
      <div class="empty-card">
        <h2>Encara no tens favorits</h2>
        <p>Quan marques un producte amb el cor, apareixerà ací.</p>
        <a routerLink="/products">Explorar productes</a>
      </div>
    </ng-template>
  
  </section>
  <app-footer></app-footer>
