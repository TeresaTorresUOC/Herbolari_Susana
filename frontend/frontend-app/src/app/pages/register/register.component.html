<h2>Registrar-se</h2>

<form (ngSubmit)="onRegister()">
  <div>
    <label for="name">Nom:</label>
    <input
      type="text"
      id="name"
      name="name"
      [(ngModel)]="name"
      required
    >
  </div>

  <div>
    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="email"
      required
    >
  </div>

  <div>
    <label for="password">Contrasenya:</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="password"
      required
    >
  </div>

  <button type="submit">Registrar-se</button>

  <p>Ja tens compte? <a routerLink="/login">Iniciar sessió</a></p>
</form>

<p>{{ message }}</p>

<p *ngIf="isRegistered">
  Registre completat correctament.
</p>
