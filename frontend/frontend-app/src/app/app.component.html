<header class="navbar">
  <div class="logo">
    <a routerLink="/">Herbolari Susana</a>
  </div>

  <nav class="menu">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/products" routerLinkActive="active">Productes</a>
    <a routerLink="/cart" routerLinkActive="active">Carret</a>
    <a routerLink="/checkout" routerLinkActive="active">Checkout</a>

    <a *ngIf="authService.getCurrentUser()?.role === 'admin'"
       routerLink="/admin"
       routerLinkActive="active">
      Admin
    </a>

    <a *ngIf="!authService.getCurrentUser()" routerLink="/login" routerLinkActive="active">
      Usuari
    </a>

    <span *ngIf="authService.getCurrentUser()" class="user-name">
      Hola, {{ authService.getCurrentUser().name }}
    </span>

    <button *ngIf="authService.getCurrentUser()" (click)="logout()" class="logout-btn">
      Tancar sessió
    </button>
  </nav>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
